packaging:
  stage: package
  script:
    - npm run test:package
    - npm run test:tarball
  artifacts:
    expire_in: 1 week
    paths:
      - reports/package-dry-run.json

publish:
  stage: publish
  needs:
    - format
    - lint
    - types
    - unit
    - contrast
    - axe
    - performance
    - audit
    - secrets
    - osv
    - sbom
    - packaging
  resource_group: npm-publish
  script:
    - node scripts/check-release.mjs "$CI_COMMIT_TAG"
    - test -n "$NPM_TOKEN"
    - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
    - npm publish --access public
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/'
