packaging:
  stage: package
  script:
    - npm run test:package
  artifacts:
    expire_in: 1 week
    paths:
      - reports/package-dry-run.json

publish:
  stage: publish
  needs:
    - format
    - lint
    - types
    - unit
    - contrast
    - axe
    - performance
    - audit
    - secrets
    - osv
    - sbom
    - packaging
  resource_group: npm-publish
  script:
    - node scripts/check-release.mjs "$CI_COMMIT_TAG"
    - npm config set @adenyrr:registry "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
    - npm config set "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken" "$CI_JOB_TOKEN"
    - npm publish
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/'
