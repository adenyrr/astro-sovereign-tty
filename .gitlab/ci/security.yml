audit:
  stage: security
  script:
    - npm audit --audit-level=high

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  before_script: []
  cache: []
  script:
    - gitleaks git --redact --no-banner --report-format json --report-path gitleaks.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks.json

osv:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:v2.5.1
    entrypoint: ['']
  before_script: []
  cache: []
  script:
    - /root/osv-scanner scan source --recursive .

sbom:
  stage: security
  script:
    - npm sbom --sbom-format cyclonedx > gl-sbom.cdx.json
  artifacts:
    expire_in: 1 month
    paths:
      - gl-sbom.cdx.json

renovate:
  stage: security
  image:
    name: renovate/renovate:44.46.0
    entrypoint: ['']
  before_script: []
  cache: []
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ENDPOINT: '$CI_API_V4_URL'
    RENOVATE_AUTODISCOVER: 'false'
  script:
    - renovate "$CI_PROJECT_PATH"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $RUN_RENOVATE == "true"'
    - when: never
