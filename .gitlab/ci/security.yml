audit:
  stage: security
  script:
    - npm audit --audit-level=high

secrets:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: ['']
  before_script: []
  cache: []
  script:
    - gitleaks git --redact --no-banner --report-format json --report-path gitleaks.json
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - gitleaks.json

osv:
  stage: security
  image:
    name: ghcr.io/google/osv-scanner:v2.5.1
    entrypoint: ['']
  before_script: []
  cache: []
  script:
    - osv-scanner scan source --recursive .

sbom:
  stage: security
  script:
    - npm sbom --sbom-format cyclonedx > gl-sbom.cdx.json
  artifacts:
    expire_in: 1 month
    paths:
      - gl-sbom.cdx.json
