# @adenyrr/astro-ui — bibliothèque de composants Astro
#
# Aucun Docker requis : le paquet ne produit ni image ni site.
# La présence de ce fichier désactive Auto DevOps sur le projet.
 
default:
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
 
variables:
  ASTRO_TELEMETRY_DISABLED: "1"
  npm_config_fund: "false"
  npm_config_audit: "false"
 
stages:
  - check
  - publish
 
# ── Vérifications ───────────────────────────────────────────────
 
typecheck:
  stage: check
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
 
audit:
  stage: check
  script:
    - npm audit --audit-level=high
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

 
# ── Publication vers le registre npm GitLab ─────────────────────
# Déclenché uniquement sur un tag : git tag v1.0.1 && git push --tags
# La version du tag doit correspondre au champ "version" de package.json.
 
publish:
  stage: publish
  script:
    - |
      if [ "v$(node -p "require('./package.json').version")" != "$CI_COMMIT_TAG" ]; then
        echo "Le tag $CI_COMMIT_TAG ne correspond pas à la version de package.json." >&2
        exit 1
      fi
    - echo "@adenyrr:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" > .npmrc
    - echo "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG
